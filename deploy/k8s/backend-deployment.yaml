apiVersion: apps/v1
kind: Deployment
metadata:
  name: zero-trust-gateway-backend
  namespace: zero-trust-security
  labels:
    app: zero-trust-gateway
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zero-trust-gateway
      tier: backend
  template:
    metadata:
      labels:
        app: zero-trust-gateway
        tier: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway-api
          image: zero-trust-gateway-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: zero-trust-gateway-backend
  namespace: zero-trust-security
spec:
  type: ClusterIP
  selector:
    app: zero-trust-gateway
    tier: backend
  ports:
    - port: 8000
      targetPort: 8000
      name: http
